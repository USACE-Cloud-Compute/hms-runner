# Builds Dockerfile.prod for every supported HEC-HMS version and pushes the images
# to GHCR when a release is published.
#
# Tags for release v1.2.3:  hms-runner:1.2.3-hms4.13, hms-runner:hms4.13, and
# hms-runner:latest from the row marked default: true.
#
# linux/amd64 only: the HEC-HMS artifact is linux64.
#
# ---------------------------------------------------------------------------
# ONE MATRIX ROW = ONE COMPLETE TOOLCHAIN
#
# A HEC-HMS release pins more than an artifact. Every key below feeds one build-arg
# of Dockerfile.prod, so a new release is one row, never an edit in four places:
#
#   hms              -> HMS_VERSION          the artifact itself
#   builderImage     -> BUILDER_BASE_IMAGE   javac must be >= the release's class-file
#                                            target (4.14 is 65.0)
#   gradleVersion    -> GRADLE_VERSION       Gradle must be able to EXECUTE on that JDK
#   javaCompat       -> JAVA_COMPAT          emitted bytecode; must be <= runtimeJava
#   runtimeJava      -> RUNTIME_JAVA         apt JRE package + the ENTRYPOINT runtime
#   runtimeBaseImage -> RUNTIME_BASE_IMAGE   must ship openjdk-<runtimeJava>
#   tarballUrl       -> HMS_TARBALL_URL      optional, when HEC's artifact name matches
#                                            neither probe shape
#
# Why each exists, all learned from 4.14:
#   * 4.14's hms.jar is class file 65.0; Java 17 javac cannot read it. The failure is
#     26 errors starting "class file has wrong version 65.0, should be 61.0" and it
#     looks exactly like an API change. It is not one.
#   * Gradle 7.3.1 cannot execute on Java 21 (it supports 8-17), so JDK and Gradle move
#     together; Java 21 needs Gradle >= 8.5.
#   * 21 bytecode on a 17 JRE dies at start with UnsupportedClassVersionError, and the
#     old smoke test could not see that: it hard-coded java-17-openjdk-amd64.
#   * 4.14 moved libjavaHeclib.so from bin/ to bin/javaHeclib/. Such a leg compiles and
#     starts clean, then dies inside Project.open with UnsatisfiedLinkError.
#   * Wrong PROJ/GDAL paths do not fail a run, they print
#     "ERROR 1: PROJ: proj_create_from_database: Cannot find proj.db" and let the
#     simulation complete. Asserted now, because a green-but-wrong leg is the worst
#     outcome available.
#
# Deliberately absent, and why (CI cannot work this out on its own):
#   4.12         builds and starts green, but has no excess-precipitation export
#                action, so the image cannot serve real workloads.
#   4.13-beta.6  superseded by the 4.13 release; nothing published is pinned to it.
#   4.15-beta.2  HEC publishes no linux64 build of it (macOS and win-x64 only).
#   4.15-beta.1  HAS a linux64 build: add a row, expect the Java 21 / Gradle 9 toolchain
#                and bin/javaHeclib like 4.14, and dry_run before trusting the answer.
#
# Testing a version without publishing: dispatch with dry_run ticked, or locally (all
# four new args default to today's 4.13 toolchain):
#   docker build -f Dockerfile.prod --build-arg HMS_VERSION=4.14 \
#     --build-arg BUILDER_BASE_IMAGE=eclipse-temurin:21-jdk \
#     --build-arg GRADLE_VERSION=9.7.1 --build-arg JAVA_COMPAT=21 \
#     --build-arg RUNTIME_JAVA=21 --build-arg RUNTIME_BASE_IMAGE=ubuntu:24.04 \
#     --build-arg CC_SDK_SHA256="$CC_SDK_SHA256" -t hms-runner:local-4.14 .

name: Build & Publish (Dockerfile.prod to GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and smoke test every leg, push nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  # Lowercase, unlike the org login -- ghcr.io rejects uppercase image names.
  IMAGE: ghcr.io/usace-cloud-compute/hms-runner
  DOCKERFILE: Dockerfile.prod
  # cc-java-sdk-1.1.2-all.jar is a 92 MB binary and is not committed here, so it is
  # fetched from the release and verified against this digest. GitHub publishes the
  # digest on the release asset itself, so this is authoritative -- an empty value
  # meant every published image was built from an unverified artifact.
  CC_SDK_VERSION: '1.1.2'
  CC_SDK_SHA256: 'a245a7cdc89c5512d865eaf0b85d3d056af1821ae6dda7c6b7610a22e3840cd0'

jobs:
  build:
    # The toolchain is in the job name: when two legs fail differently it is nearly
    # always the toolchain, and the log has to say which one this was.
    name: hms ${{ matrix.hms }} (java ${{ matrix.javaCompat }}, gradle ${{ matrix.gradleVersion }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every leg pulls ~1 GB from HEC Nexus. If downloads start failing with 429/5xx,
      # uncomment so the legs stop sharing one source IP at the same moment.
      # max-parallel: 1
      # A broken leg must not hide a good one.
      fail-fast: false
      matrix:
        include:
          # Quote every version. Unquoted YAML reads 4.13 as a number, and 4.10 would
          # silently become "4.1" in the tag and in the tarball URL; the Java and Gradle
          # numbers have the same trap.
          - hms: "4.13"
            default: false
            builderImage: eclipse-temurin:17-jdk
            gradleVersion: "7.3.1"
            javaCompat: "17"
            runtimeJava: "17"
            runtimeBaseImage: ubuntu:20.04
            # 4.13 needs the doubled platform name
            # (hec-hms-4.13-linux64-linux64.tar.gz), which the Dockerfile's first probe
            # shape finds. runtimeBaseImage stays 20.04 to preserve today's published
            # glibc -- changing it is a separate decision from adding a toolchain axis.

          - hms: "4.14"
            default: true
            builderImage: eclipse-temurin:21-jdk
            gradleVersion: "9.7.1"
            javaCompat: "21"
            runtimeJava: "21"
            # Cannot reuse the 4.13 base: ubuntu:20.04 has no openjdk-21-jre-headless.
            # That is precisely why runtimeBaseImage is a per-row key and not a
            # workflow-level env value.
            runtimeBaseImage: ubuntu:24.04
            # 4.14 uses the single-token name (hec-hms-4.14-linux64.tar.gz), which the
            # second probe shape finds -- no tarballUrl needed.
            # default stays false: promoting 4.14 to `latest` is a decision, not a side
            # effect of it finally building.

          # Escape hatch when HEC's artifact name matches neither probe shape:
          #   tarballUrl: https://.../hec-hms-4.14-linux64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        env:
          HMS: ${{ matrix.hms }}
          IS_DEFAULT: ${{ matrix.default }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # On a release event this is the tag (v1.2.3 -> 1.2.3); on a dispatch it
          # is the branch name, which is fine because a dry run pushes nothing.
          image_version="${GITHUB_REF_NAME}"
          version="${image_version#v}"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            local_tag="hms-runner:local-${HMS}"
            {
              echo "version=${version}"
              echo "primary=${local_tag}"
              echo "tags<<EOF"
              echo "${local_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "dry run: ${local_tag} only, nothing pushed"
          else
            {
              echo "version=${version}"
              echo "primary=${IMAGE}:${image_version}-hms${HMS}"
              echo "tags<<EOF"
              echo "${IMAGE}:${image_version}-hms${HMS}"
              echo "${IMAGE}:hms${HMS}"
              # The README has always promised `latest` follows the default leg; the
              # workflow never pushed it. Guarded by IS_DEFAULT so no leg claims it
              # twice. Delete this if publishing `latest` is not what you want.
              if [ "${IS_DEFAULT}" = "true" ]; then
                echo "${IMAGE}:latest"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "tags for ${image_version} / HEC-HMS ${HMS}:"
            printf '  %s\n' "${IMAGE}:${image_version}-hms${HMS}" "${IMAGE}:hms${HMS}"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.dry_run != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.DOCKERFILE }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          pull: true
          load: ${{ inputs.dry_run == true }}
          push: ${{ inputs.dry_run != true }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            HMS_VERSION=${{ matrix.hms }}
            HMS_TARBALL_URL=${{ matrix.tarballUrl }}
            BUILDER_BASE_IMAGE=${{ matrix.builderImage }}
            GRADLE_VERSION=${{ matrix.gradleVersion }}
            JAVA_COMPAT=${{ matrix.javaCompat }}
            RUNTIME_JAVA=${{ matrix.runtimeJava }}
            RUNTIME_BASE_IMAGE=${{ matrix.runtimeBaseImage }}
            RUNNER_VERSION=${{ steps.tags.outputs.version }}
            CC_SDK_VERSION=${{ env.CC_SDK_VERSION }}
            CC_SDK_SHA256=${{ env.CC_SDK_SHA256 }}
          labels: |
            org.opencontainers.image.title=HEC-HMS Runner
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            # Toolchain provenance, so `docker inspect` can answer "which HEC-HMS and
            # which JVM is in this tag?" without rebuilding it. Bytecode level and
            # runtime JRE are the pair that must not be crossed, and a floating hms4.14
            # tag carries no other clue.
            io.github.usace-cloud-compute.hms.version=${{ matrix.hms }}
            io.github.usace-cloud-compute.hms.bytecode=${{ matrix.javaCompat }}
            io.github.usace-cloud-compute.hms.runtime-java=${{ matrix.runtimeJava }}
            io.github.usace-cloud-compute.hms.gradle=${{ matrix.gradleVersion }}
            io.github.usace-cloud-compute.cc-java-sdk.version=${{ env.CC_SDK_VERSION }}
          # Scope the cache per leg. The ~1 GB tarball layer is what makes a leg slow,
          # and an unscoped cache lets legs evict each other. The toolchain is in the
          # scope now: two rows sharing an HMS version but not a Gradle/JDK must not
          # read each other's layers.
          cache-from: type=gha,scope=hms-${{ matrix.hms }}-j${{ matrix.runtimeJava }}-g${{ matrix.gradleVersion }}
          cache-to: type=gha,mode=max,scope=hms-${{ matrix.hms }}-j${{ matrix.runtimeJava }}-g${{ matrix.gradleVersion }}
          # A plain image manifest: buildx's default attestation makes the pushed digest
          # an attestation index, which older container stacks refuse.
          provenance: false
          sbom: false
